<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Artikel | Bionest One</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script>tailwind.config={theme:{extend:{colors:{techCyan:'#00f2fe',techBlue:'#4facfe',techDark:'#0b1120',techCard:'#1e293b'}}}};</script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="library.css"></head>
<body class="bg-techDark text-slate-100 font-sans antialiased bg-grid min-h-screen"><nav class="fixed top-0 w-full z-50 bg-techDark/85 backdrop-blur-md border-b border-cyan-500/20"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"><a href="library.html" class="inline-flex items-center gap-2 text-sm text-cyan-300 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i>Library</a><span class="text-xs text-slate-600 font-mono">ARTICLE</span></div></nav>
<main class="pt-28 pb-20 max-w-3xl mx-auto px-5"><div id="status" class="text-sm text-slate-500">Memuat artikel...</div><article id="article" class="hidden"><span id="category" class="text-[10px] uppercase tracking-[.25em] text-techCyan font-mono"></span><h1 id="title" class="text-4xl md:text-5xl font-black leading-tight mt-3"></h1><div class="flex items-center gap-3 mt-5 pb-7 border-b border-slate-800"><div id="avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-techCyan to-techBlue text-techDark flex items-center justify-center font-black"></div><div><p id="author" class="text-sm font-bold"></p><p id="date" class="text-xs text-slate-500 mt-1"></p></div></div><p id="excerpt" class="text-lg text-slate-400 leading-relaxed mt-7"></p><div id="content" class="library-editor text-slate-200 mt-8"></div></article></main>
<script src="library.js"></script><script>async function load(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Artikel tidak ditemukan.');const items=await Library.list();const x=items.find(i=>i.id===id&&i.type==='article');if(!x)throw new Error('Artikel tidak ditemukan.');status.classList.add('hidden');article.classList.remove('hidden');category.textContent=x.category;title.textContent=x.title;author.textContent=x.author;date.textContent=Library.formatDate(x.created_at);avatar.textContent=(x.author||'?').slice(0,1).toUpperCase();excerpt.textContent=x.excerpt||'';content.innerHTML=x.content;lucide.createIcons()}catch(e){status.textContent=e.message}}lucide.createIcons();load();</script></body></html>
