<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin | XI.B1</title><meta name="robots" content="noindex,nofollow">
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-techDark text-slate-100 font-sans antialiased bg-grid">
<main class="max-w-6xl mx-auto px-4 py-10">
<header class="flex items-center justify-between gap-4 mb-8">
<div><p class="text-xs text-techCyan uppercase tracking-[0.25em] font-mono">XI.B1 Control</p><h1 class="text-3xl font-extrabold mt-1">Super Admin</h1></div>
<button id="logout" class="px-4 py-2 rounded-xl border border-slate-700 hover:border-red-400/50 hover:text-red-300 transition">Logout</button>
</header>
<section class="p-6 rounded-2xl bg-techCard border border-cyan-500/20">
<div class="flex items-center gap-2 mb-5"><i data-lucide="shield-check" class="text-techCyan"></i><h2 class="text-xl font-bold">Student Accounts</h2></div>
<div id="studentList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3"><p class="text-sm text-slate-500">Memuat...</p></div>
</section>
<p class="text-xs text-slate-600 mt-5">Account creation/reset password sebaiknya dilakukan melalui Supabase Admin/Edge Function, bukan service key di browser.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script>
<script>
(async()=>{
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){location.href='login.html';return;}
 const {data:me,error:meError}=await supabaseClient.from('profiles').select('role').eq('id',session.user.id).single();
 if(meError||me?.role!=='super_admin'){location.href='dashboard.html';return;}
 const {data:students}=await supabaseClient.from('profiles').select('username,full_name,role,quote').order('full_name');
 const list=document.getElementById('studentList');
 list.innerHTML=(students||[]).map(s=>'<div class="p-4 rounded-xl bg-slate-900/60 border border-slate-800"><p class="font-semibold">'+(s.full_name||'-')+'</p><p class="text-xs text-techCyan mt-1">@'+s.username+'</p><p class="text-xs text-slate-500 mt-2">'+s.role+'</p></div>').join('')||'<p class="text-sm text-slate-500">Belum ada akun.</p>';
})();
document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();sessionStorage.clear();location.href='index.html';};
lucide.createIcons();
</script>
</body></html>
