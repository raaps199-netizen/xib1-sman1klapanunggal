<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dokumen | Bionest One</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script>tailwind.config={theme:{extend:{colors:{techCyan:'#00f2fe',techBlue:'#4facfe',techDark:'#0b1120',techCard:'#1e293b'}}}};</script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="library.css"></head>
<body class="bg-techDark text-slate-100 font-sans antialiased bg-grid min-h-screen"><nav class="fixed top-0 w-full z-50 bg-techDark/85 backdrop-blur-md border-b border-cyan-500/20"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"><a href="library.html" class="inline-flex items-center gap-2 text-sm text-cyan-300 hover:text-white"><i data-lucide="arrow-left" class="w-4 h-4"></i>Library</a><span class="text-xs text-slate-600 font-mono">DOCUMENT VIEWER</span></div></nav>
<main class="pt-28 pb-16 max-w-6xl mx-auto px-4"><div id="status" class="text-sm text-slate-500">Memuat dokumen...</div><section id="view" class="hidden"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6"><div><p id="category" class="text-[10px] uppercase tracking-[.25em] text-techCyan font-mono"></p><h1 id="title" class="text-3xl md:text-4xl font-black mt-2"></h1><p id="meta" class="text-xs text-slate-500 mt-2"></p></div><div class="flex flex-wrap gap-2"><a id="download" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-cyan-500/25 text-cyan-200 hover:bg-cyan-500/10 text-sm font-bold"><i data-lucide="download" class="w-4 h-4"></i>Download</a><button id="previewBtn" class="hidden inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-200 hover:bg-cyan-500/20 text-sm font-bold"><i data-lucide="eye" class="w-4 h-4"></i>Preview PDF</button></div></div><p id="description" class="text-sm text-slate-400 mb-5"></p><div id="pdf" class="hidden mt-5 rounded-2xl overflow-hidden border border-slate-800 bg-slate-950"><iframe class="w-full h-[75vh]" title="PDF preview" loading="lazy"></iframe></div><div id="word" class="hidden p-10 rounded-2xl bg-techCard border border-slate-800 text-center"><i data-lucide="file-type-2" class="w-12 h-12 mx-auto text-techCyan"></i><p class="font-bold mt-4">Dokumen Word siap diunduh.</p><p class="text-xs text-slate-500 mt-2">Format DOC/DOCX dibuka melalui aplikasi dokumen di perangkat lu.</p></div></section></main>
<script src="library.js"></script><script>async function load(){try{const id=new URLSearchParams(location.search).get('id');const items=await Library.list();const x=items.find(i=>i.id===id&&i.type==='file');if(!x)throw new Error('Dokumen tidak ditemukan.');status.classList.add('hidden');view.classList.remove('hidden');category.textContent=x.category;title.textContent=x.title;meta.textContent=x.author+' • '+Library.formatDate(x.created_at)+' • '+Library.size(x.size);description.textContent=x.description||'';const fileUrl=Library.fileUrl(x);download.href=fileUrl+(fileUrl.includes('?')?'&':'?')+'download=1';download.setAttribute('download',x.filename||''); if(x.mime==='application/pdf'){previewBtn.classList.remove('hidden');previewBtn.onclick=()=>{pdf.classList.remove('hidden');const frame=pdf.querySelector('iframe');if(!frame.src||frame.src===location.href)frame.src=fileUrl;previewBtn.textContent='PDF terbuka di bawah';previewBtn.disabled=true;lucide.createIcons()}}else{word.classList.remove('hidden')}lucide.createIcons()}catch(e){status.textContent=e.message}}lucide.createIcons();load();</script></body></html>
