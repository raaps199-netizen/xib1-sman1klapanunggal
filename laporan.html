<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bionest One · Laporan</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{techCyan:'#00f2fe',techBlue:'#4facfe',techDark:'#0b1120',techCard:'#1e293b'}}}}</script></head>
<body class="min-h-screen bg-techDark text-white"><main class="max-w-3xl mx-auto p-5 sm:p-8">
<a href="index.html" class="text-slate-400 text-sm">← Kembali</a><h1 class="text-3xl font-black mt-8">Laporan Kelas</h1><p class="text-slate-400 mt-2">Halaman khusus guru.</p>
<div id="login" class="mt-7 p-5 rounded-3xl bg-techCard border border-cyan-500/15"><p class="font-bold">Verifikasi Guru</p><p class="text-sm text-slate-400 mt-1">Masukkan kode guru untuk membuka formulir.</p><input id="pin" type="password" inputmode="text" autocomplete="off" placeholder="Kode guru" class="mt-4 w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700"><button id="loginBtn" type="button" class="mt-3 w-full p-3 rounded-xl bg-gradient-to-r from-techCyan to-techBlue text-slate-950 font-bold active:scale-95 transition-transform">Masuk sebagai Guru</button><p id="loginMsg" class="text-sm text-center mt-3"></p></div>
<div id="report" class="hidden mt-7 p-5 rounded-3xl bg-techCard border border-cyan-500/15">
<p id="teacherBadge" class="text-sm text-cyan-300 font-semibold mb-4"></p><input id="q" placeholder="Cari nama siswa..." class="w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700">
<div id="students" class="grid gap-2 mt-3 max-h-72 overflow-y-auto"></div>
<div id="panel" class="hidden mt-6 pt-6 border-t border-white/10"><b id="name"></b><div id="types" class="grid gap-2 mt-4"></div><p id="msg" class="text-sm text-center mt-4"></p></div>
</div></main>
<script>
const S=[['khafi','Ashabul Khafi'],['arjasena','Satria Arjasena Maulana'],['orlen','Danendra Orlen Wasatha'],['avisha','Avisha Fakhiran Anwar'],['fareal','Fareal Julyans Zalfine'],['andrian','Andrian Pranata Tambunan'],['sadam','Sadam Al Fahri'],['wisnu','Wisnu Panji Pratama'],['tania','Tania Fitri Izati'],['jauharah','Jauharah Tuhfah'],['keyla','Keyla Ajeng Firmansyah'],['mikaela','Mikaela Leona'],['ridho','Ridho Saputra Ependi'],['rizky','Rizky Dwi Saputra Hidayat'],['zyella','Zyella Almaira Sigit'],['nishar','Nishar Soma Maulana'],['alvian','Alvian Arkan Iniesta'],['brella','Brela Terta Zafina'],['fathian','Fathian Khairul Akbar'],['reno','Reno Ramzi Nararya'],['lutfan','Lutfan Attaullah Sultoni'],['rafif','Ahmad Rafif Hidayat'],['kevin','Kevin Habiyal Huda'],['arya','Arya Pratama'],['almira','Al Mira Berlian Handayani'],['elang','Elang Bari Dermawan'],['dzaky','Muhammad Dzaky Pradana'],['aisahra','Aisahra Mayjasti Aulia Putri'],['satria','Satria Putra Pratama'],['putri','Putri Aulia'],['fahri','Muhammad Fahri Maulana'],['rifqi','Rifqi Binangkit'],['fadhil','Askha Fadhil Raihan Adinomo'],['yusuf','Harazaki Yusuf Rahardjo Telaumbanua'],['kirana','Kirana Intan Permata'],['effan','Effan Zandra Arya Putra'],['dzaki','Dzakii Nizaar Akmal'],['aura','Aura Rizky Triyastuti'],['reva','Reva Amalia Achmad'],['surya','Surya Melano'],['dhirgam',"Dhirgam Nawi Hasib Dhiya Ul'Haq"],['yoga','Yoga Rizki Ramadhan'],['dude','Dude Ramadhan'],['daffa','M. Daffa Azalia'],['irfan','Irfan Asyraf Musyaffa'],['ara','Ara Ananda Putri'],['anissa','Annisa Zahra'],['meli','Meli Anggraeni'],['gibran','Gibran Ayatullah'],['salsabila','Salsabil Fajrianita']].map(x=>({username:x[0],name:x[1]})).sort((a,b)=>a.name.localeCompare(b.name));
const V=[
  {category:'Kedisiplinan & Pembelajaran',items:[
    'Tidur di kelas',
    'Berisik / mengganggu kelas',
    'Tidak mendengarkan guru',
    'Telat masuk kelas',
    'Tidak mengerjakan tugas',
    'Tidak mengumpulkan tugas',
    'Tidak mengikuti kegiatan pembelajaran',
    'Mengganggu teman saat belajar',
    'Keluar kelas tanpa izin',
    'Bermain HP saat pembelajaran',
    'Makan / minum saat pembelajaran'
  ]},
  {category:'Tata Tertib',items:[
    'Tidak memakai seragam sesuai ketentuan',
    'Tidak memakai atribut sekolah lengkap',
    'Tidak membawa perlengkapan belajar',
    'Datang terlambat ke sekolah',
    'Meninggalkan sekolah tanpa izin',
    'Membawa barang yang tidak diperbolehkan'
  ]},
  {category:'Etika & Perilaku',items:[
    'Berkata tidak sopan',
    'Tidak menghormati guru',
    'Mengganggu atau mengejek teman',
    'Bertengkar dengan teman',
    'Menyontek / membantu menyontek',
    'Merusak fasilitas sekolah'
  ]}
];
let chosen = null;
let teacherToken = sessionStorage.getItem('bionestTeacherToken') || '';
let teacherName = sessionStorage.getItem('bionestTeacherName') || '';
let teacherSubject = sessionStorage.getItem('bionestTeacherSubject') || '';

const pinInput = document.getElementById('pin');
const loginBtn = document.getElementById('loginBtn');
const loginBox = document.getElementById('login');
const reportBox = document.getElementById('report');
const loginMsg = document.getElementById('loginMsg');
const teacherBadge = document.getElementById('teacherBadge');
const searchInput = document.getElementById('q');

function setLoginMessage(text, colour) {
  loginMsg.textContent = text || '';
  loginMsg.className = 'text-sm text-center mt-3 ' + (colour || '');
}

async function teacherLogin() {
  const pin = pinInput.value.trim();

  if (!pin) {
    setLoginMessage('Masukkan kode guru.', 'text-red-400');
    pinInput.focus();
    return;
  }

  loginBtn.disabled = true;
  loginBtn.classList.add('opacity-70', 'scale-95');
  loginBtn.textContent = 'Memverifikasi...';
  setLoginMessage('Memverifikasi kode guru...', 'text-slate-400');

  try {
    const response = await fetch('/api/violation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'teacher_login', pin })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Kode guru salah.');
    }

    teacherToken = data.token;
    teacherName = data.teacher_name || '';
    teacherSubject = data.subject || '';

    sessionStorage.setItem('bionestTeacherToken', teacherToken);
    sessionStorage.setItem('bionestTeacherName', teacherName);
    sessionStorage.setItem('bionestTeacherSubject', teacherSubject);

    loginBox.classList.add('hidden');
    reportBox.classList.remove('hidden');
    teacherBadge.textContent = 'Login sebagai: ' + teacherName + (teacherSubject ? ' · ' + teacherSubject : '');
    draw();

  } catch (error) {
    setLoginMessage(error.message || 'Terjadi kesalahan.', 'text-red-400');
  } finally {
    loginBtn.disabled = false;
    loginBtn.classList.remove('opacity-70', 'scale-95');
    loginBtn.textContent = 'Masuk sebagai Guru';
  }
}

loginBtn.addEventListener('click', teacherLogin);
pinInput.addEventListener('keydown', function(event) {
  if (event.key === 'Enter') teacherLogin();
});

function draw() {
  const query = searchInput.value.toLowerCase().trim();
  const list = document.getElementById('students');

  list.innerHTML = S
    .filter(function(student) {
      return student.name.toLowerCase().includes(query);
    })
    .map(function(student) {
      return '<button type="button" class="text-left p-3 rounded-xl bg-slate-950/40 border border-white/5 hover:border-cyan-400/30 active:scale-[0.99] transition-transform" data-u="' + student.username + '">' + student.name + '</button>';
    })
    .join('');

  list.querySelectorAll('[data-u]').forEach(function(button) {
    button.addEventListener('click', function() {
      pick(S.find(function(student) {
        return student.username === button.dataset.u;
      }));
    });
  });
}

function pick(student) {
  chosen = student;
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('name').textContent = student.name;

  const types = document.getElementById('types');

  types.innerHTML = V.map(function(group) {
    return '<div class="mt-3">' +
      '<p class="text-xs font-bold text-slate-400 mb-2">' + group.category + '</p>' +
      group.items.map(function(item) {
        return '<button type="button" class="text-left w-full p-3 mb-2 rounded-xl bg-slate-950/40 border border-white/5 hover:border-cyan-400/30 active:scale-[0.99] transition-transform" data-v="' + item.replace(/"/g, '&quot;') + '" data-c="' + group.category + '">' + item + '</button>';
      }).join('') +
      '</div>';
  }).join('') +
  '<div class="mt-4">' +
    '<p class="text-xs font-bold text-slate-400 mb-2">Lainnya</p>' +
    '<button type="button" id="otherBtn" class="text-left w-full p-3 rounded-xl bg-slate-950/40 border border-cyan-400/20 hover:border-cyan-400/40 active:scale-[0.99] transition-transform">Tulis pelanggaran lainnya</button>' +
  '</div>';

  types.querySelectorAll('[data-v]').forEach(function(button) {
    button.addEventListener('click', function() {
      send(button.dataset.v, button.dataset.c);
    });
  });

  document.getElementById('otherBtn').addEventListener('click', customViolation);
}

async function send(violationName, category) {
  if (!teacherToken) {
    return showMessage('Sesi guru tidak ditemukan.', 'text-red-400');
  }

  if (!confirm('Catat laporan untuk ' + chosen.name + ' pada pelajaran ' + teacherSubject + '?')) {
    return;
  }

  showMessage('Menyimpan...', 'text-slate-400');

  try {
    const response = await fetch('/api/violation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        teacher_token: teacherToken,
        student: chosen.username,
        category: category,
        violation: violationName
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Gagal menyimpan.');
    }

    const saved = data.violation;

    showMessage(
      '✓ Laporan berhasil dicatat. Terima kasih. Mohon maaf atas pelanggaran yang terjadi. · ' +
      saved.student_name + ' · ' + saved.violation + ' · ' + saved.subject + ' · ' +
      saved.date + ' ' + saved.time,
      'text-emerald-400'
    );
  } catch (error) {
    showMessage(error.message || 'Gagal menyimpan.', 'text-red-400');
  }
}

function customViolation() {
  const text = prompt('Tulis pelanggaran yang dilakukan siswa:');

  if (!text || !text.trim()) return;

  const violationName = text.trim();

  if (violationName.length > 200) {
    return showMessage('Pelanggaran terlalu panjang. Maksimal 200 karakter.', 'text-red-400');
  }

  send(violationName, 'Lainnya');
}

function showMessage(text, colour) {
  const element = document.getElementById('msg');
  element.className = 'text-sm text-center mt-4 ' + colour;
  element.textContent = text;
}

searchInput.addEventListener('input', draw);

if (teacherToken) {
  loginBox.classList.add('hidden');
  reportBox.classList.remove('hidden');
  teacherBadge.textContent = 'Login sebagai: ' + teacherName + (teacherSubject ? ' · ' + teacherSubject : '');
}

draw();
</script></body></html>
