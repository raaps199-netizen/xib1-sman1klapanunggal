<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bionest One · Laporan</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{techCyan:'#00f2fe',techBlue:'#4facfe',techDark:'#0b1120',techCard:'#1e293b'}}}}</script></head>
<body class="min-h-screen bg-techDark text-white"><main class="max-w-3xl mx-auto p-5 sm:p-8">
<a href="index.html" class="text-slate-400 text-sm">← Kembali</a><h1 class="text-3xl font-black mt-8">Laporan Kelas</h1><p class="text-slate-400 mt-2">Halaman khusus guru.</p>
<div id="login" class="mt-7 p-5 rounded-3xl bg-techCard border border-cyan-500/15"><p class="font-bold">Verifikasi Guru</p><p class="text-sm text-slate-400 mt-1">Masukkan PIN guru untuk membuka formulir.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN guru" class="mt-4 w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700"><button id="loginBtn" class="mt-3 w-full p-3 rounded-xl bg-gradient-to-r from-techCyan to-techBlue text-slate-950 font-bold">Masuk sebagai Guru</button><p id="loginMsg" class="text-sm text-center mt-3"></p></div>
<div id="report" class="hidden mt-7 p-5 rounded-3xl bg-techCard border border-cyan-500/15">
<input id="q" placeholder="Cari nama siswa..." class="w-full p-3 rounded-xl bg-slate-950/60 border border-slate-700">
<div id="students" class="grid gap-2 mt-3 max-h-72 overflow-y-auto"></div>
<div id="panel" class="hidden mt-6 pt-6 border-t border-white/10"><b id="name"></b><div id="types" class="grid gap-2 mt-4"></div><p id="msg" class="text-sm text-center mt-4"></p></div>
</div></main>
<script>
const S=[['khafi','Ashabul Khafi'],['arjasena','Satria Arjasena Maulana'],['orlen','Danendra Orlen Wasatha'],['avisha','Avisha Fakhiran Anwar'],['fareal','Fareal Julyans Zalfine'],['andrian','Andrian Pranata Tambunan'],['sadam','Sadam Al Fahri'],['wisnu','Wisnu Panji Pratama'],['tania','Tania Fitri Izati'],['jauharah','Jauharah Tuhfah'],['keyla','Keyla Ajeng Firmansyah'],['mikaela','Mikaela Leona'],['ridho','Ridho Saputra Ependi'],['rizky','Rizky Dwi Saputra Hidayat'],['zyella','Zyella Almaira Sigit'],['nishar','Nishar Soma Maulana'],['alvian','Alvian Arkan Iniesta'],['brella','Brela Terta Zafina'],['fathian','Fathian Khairul Akbar'],['reno','Reno Ramzi Nararya'],['lutfan','Lutfan Attaullah Sultoni'],['rafif','Ahmad Rafif Hidayat'],['kevin','Kevin Habiyal Huda'],['arya','Arya Pratama'],['almira','Al Mira Berlian Handayani'],['elang','Elang Bari Dermawan'],['dzaky','Muhammad Dzaky Pradana'],['aisahra','Aisahra Mayjasti Aulia Putri'],['satria','Satria Putra Pratama'],['putri','Putri Aulia'],['fahri','Muhammad Fahri Maulana'],['rifqi','Rifqi Binangkit'],['fadhil','Askha Fadhil Raihan Adinomo'],['yusuf','Harazaki Yusuf Rahardjo Telaumbanua'],['kirana','Kirana Intan Permata'],['effan','Effan Zandra Arya Putra'],['dzaki','Dzakii Nizaar Akmal'],['aura','Aura Rizky Triyastuti'],['reva','Reva Amalia Achmad'],['surya','Surya Melano'],['dhirgam',"Dhirgam Nawi Hasib Dhiya Ul'Haq"],['yoga','Yoga Rizki Ramadhan'],['dude','Dude Ramadhan'],['daffa','M. Daffa Azalia'],['irfan','Irfan Asyraf Musyaffa'],['ara','Ara Ananda Putri'],['anissa','Annisa Zahra'],['meli','Meli Anggraeni'],['gibran','Gibran Ayatullah'],['salsabila','Salsabil Fajrianita']].map(x=>({username:x[0],name:x[1]})).sort((a,b)=>a.name.localeCompare(b.name));
const V=['Tidur di kelas','Berisik','Tidak mendengarkan guru','Telat masuk kelas'];
let chosen=null; const q=document.getElementById('q'); let teacherToken=sessionStorage.getItem('bionestTeacherToken');
const login=document.getElementById('login'), report=document.getElementById('report');
async function teacherLogin(){const pin=document.getElementById('pin').value.trim();const m=document.getElementById('loginMsg');if(!pin)return m.textContent='Masukkan PIN guru.';m.textContent='Memverifikasi...';try{const r=await fetch('/api/violation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'teacher_login',pin})});const d=await r.json();if(!r.ok)throw Error(d.error||'PIN salah.');teacherToken=d.token;sessionStorage.setItem('bionestTeacherToken',teacherToken);login.classList.add('hidden');report.classList.remove('hidden');m.textContent='';}catch(e){m.textContent=e.message;m.className='text-sm text-center mt-3 text-red-400';}}
document.getElementById('loginBtn').onclick=teacherLogin;
function draw(){const x=q.value.toLowerCase();document.getElementById('students').innerHTML=S.filter(s=>s.name.toLowerCase().includes(x)).map(s=>'<button class="text-left p-3 rounded-xl bg-slate-950/40 border border-white/5 hover:border-cyan-400/30" data-u="'+s.username+'">'+s.name+'</button>').join('');document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>pick(S.find(s=>s.username===b.dataset.u)));}
function pick(s){chosen=s;document.getElementById('panel').classList.remove('hidden');document.getElementById('name').textContent=s.name;document.getElementById('types').innerHTML='<p class="text-xs text-slate-400">Kedisiplinan & Pembelajaran</p>'+V.map(v=>'<button class="text-left p-3 rounded-xl bg-slate-950/40 border border-white/5 hover:border-cyan-400/30" data-v="'+v+'">'+v+'</button>').join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>send(b.dataset.v));}
async function send(v){if(!teacherToken)return msg('Sesi guru tidak ditemukan.','text-red-400');if(!confirm('Catat laporan untuk '+chosen.name+'?'))return;msg('Menyimpan...','text-slate-400');try{const r=await fetch('/api/violation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher_token:teacherToken,student:chosen.username,category:'Kedisiplinan & Pembelajaran',violation:v})});const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal menyimpan.');msg('✓ Berhasil dicatat.','text-emerald-400')}catch(e){msg(e.message,'text-red-400')}}
function msg(t,c){const e=document.getElementById('msg');e.className='text-sm text-center mt-4 '+c;e.textContent=t}q.oninput=draw;if(teacherToken){login.classList.add('hidden');report.classList.remove('hidden');}draw();
</script></body></html>
