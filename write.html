<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tulis | Library XI.B1</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script>tailwind.config={theme:{extend:{colors:{techCyan:'#00f2fe',techBlue:'#4facfe',techDark:'#0b1120',techCard:'#1e293b'}}}};</script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="library.css"></head>
<body class="bg-techDark text-slate-100 font-sans antialiased bg-grid min-h-screen"><nav class="fixed top-0 w-full z-50 bg-techDark/85 backdrop-blur-md border-b border-cyan-500/20"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"><a href="library.html" class="text-sm text-cyan-300 hover:text-white">← Library</a><span class="text-xs text-slate-600">WRITE MODE</span></div></nav>
<main class="pt-28 pb-20 max-w-3xl mx-auto px-5"><p class="text-xs text-techCyan uppercase tracking-[.3em] font-mono">LIBRARY / WRITE</p><h1 class="text-3xl font-black mt-2">Tulis sesuatu</h1><p id="who" class="text-xs text-slate-500 mt-2"></p>
<div class="mt-7 space-y-3"><input id="title" class="w-full bg-transparent text-3xl md:text-4xl font-black outline-none placeholder:text-slate-700" placeholder="Judul tulisan"><div class="grid sm:grid-cols-2 gap-3"><select id="category" class="px-3 py-2.5 rounded-xl bg-techCard border border-slate-700"><option>Artikel</option><option>Materi</option><option>Tugas</option><option>Cerita</option><option>Modul</option></select><input id="excerpt" class="px-3 py-2.5 rounded-xl bg-techCard border border-slate-700 outline-none" placeholder="Ringkasan singkat"></div>
<div class="flex flex-wrap gap-1 p-2 rounded-xl bg-techCard border border-slate-700"><button data-cmd="bold" class="tool">B</button><button data-cmd="italic" class="tool"><i>I</i></button><button data-cmd="formatBlock:h2" class="tool">H2</button><button data-cmd="formatBlock:h3" class="tool">H3</button><button data-cmd="insertUnorderedList" class="tool">• List</button><button data-cmd="insertOrderedList" class="tool">1. List</button><button data-cmd="formatBlock:blockquote" class="tool">Quote</button><button data-cmd="createLink" class="tool">Link</button></div>
<div id="editor" contenteditable="true" class="library-editor rounded-2xl bg-slate-950/30 border border-slate-800 p-5 md:p-7 text-base" data-placeholder="Mulai nulis di sini..."></div><div class="flex items-center justify-between gap-3 pt-2"><span id="status" class="text-xs text-slate-600"></span><button id="publish" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-techCyan to-techBlue text-techDark font-black">Publikasikan</button></div></div></main>
<style>.tool{padding:.45rem .65rem;border-radius:.5rem;color:#cbd5e1;font-size:.75rem;font-weight:700}.tool:hover{background:rgba(0,242,254,.1);color:#00f2fe}.library-editor:empty:before{content:attr(data-placeholder);color:#475569}.library-editor a{color:#67e8f9;text-decoration:underline}</style>
<script src="library.js"></script><script>
const auth=Library.session();who.textContent=auth.profile?'Menulis sebagai '+(auth.profile.full_name||auth.username):'Login diperlukan';
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{let c=b.dataset.cmd;if(c==='createLink'){let u=prompt('URL:');if(u)document.execCommand('createLink',false,u)}else if(c.startsWith('formatBlock:'))document.execCommand('formatBlock',false,c.split(':')[1]);else document.execCommand(c,false,null);editor.focus()});
publish.onclick=async()=>{try{if(!auth.username)throw new Error('Login dulu untuk menulis.');if(!title.value.trim()||!editor.innerHTML.trim())throw new Error('Judul dan isi tulisan wajib diisi.');publish.disabled=true;status.textContent='Menyimpan ke Library...';await Library.request({action:'create_article',title:title.value,category:category.value,excerpt:excerpt.value,content:editor.innerHTML});status.textContent='Tulisan dikirim. Menunggu konfirmasi admin.'; setTimeout(()=>location.href='library.html',1200)}catch(e){status.textContent=e.message;publish.disabled=false}};
</script></body></html>
