<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Library | Bionest One</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script>tailwind.config={theme:{extend:{colors:{techCyan:'#00f2fe',techBlue:'#4facfe',techDark:'#0b1120',techCard:'#1e293b'}}}};</script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="library.css"></head>
<body class="bg-techDark text-slate-100 font-sans antialiased bg-grid min-h-screen">
<nav class="fixed top-0 w-full z-50 bg-techDark/85 backdrop-blur-md border-b border-cyan-500/20"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><a href="index.html" class="flex items-center gap-2 font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-techCyan to-techBlue"><i data-lucide="cpu" class="text-techCyan w-6 h-6"></i>XI.B1</a><div class="hidden md:flex items-center gap-6 text-sm font-medium"><a href="index.html" class="hover:text-techCyan transition">Home</a><a href="pelanggaran.html" class="hover:text-red-300 transition">Pelanggaran</a><a href="game/index.html" class="text-purple-300 hover:text-purple-200 transition">Game</a><a href="library.html" class="text-techCyan">Library</a></div><a href="index.html" class="text-xs text-slate-500 hover:text-white">Kembali</a></div></nav>
<main class="pt-28 pb-16 max-w-7xl mx-auto px-4">
<section class="library-hero rounded-3xl border border-cyan-500/20 p-7 md:p-10 mb-8"><div class="max-w-3xl"><p class="text-xs text-techCyan uppercase tracking-[.3em] font-mono">XI.B1 KNOWLEDGE HUB</p><h1 class="text-4xl md:text-5xl font-black mt-3">Library</h1><p class="text-slate-400 mt-3 leading-relaxed">Tempat nyimpen tulisan, materi, tugas, modul, dan dokumen kelas. Karena file penting biasanya baru dicari ketika sudah hilang.</p><div class="flex flex-wrap gap-3 mt-6"><a href="write.html" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-techCyan to-techBlue text-techDark font-bold"><i data-lucide="pen-line" class="w-4 h-4"></i>Tulis</a><a href="upload.html" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-cyan-500/25 text-cyan-200 hover:bg-cyan-500/10"><i data-lucide="upload" class="w-4 h-4"></i>Upload dokumen</a></div></div></section>
<div class="grid md:grid-cols-[1fr_auto] gap-3 mb-6"><div class="relative"><i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i><input id="search" class="w-full pl-11 pr-4 py-3 rounded-xl bg-techCard border border-slate-700 outline-none focus:border-techCyan/50" placeholder="Cari judul, penulis, kategori..."></div><select id="sort" class="px-4 py-3 rounded-xl bg-techCard border border-slate-700 outline-none"><option value="newest">Terbaru</option><option value="oldest">Terlama</option><option value="title">Judul A-Z</option></select></div>
<div id="filters" class="flex flex-wrap gap-2 mb-6"></div><div class="flex justify-between items-center mb-4"><p id="count" class="text-xs text-slate-500">Memuat Library...</p><button id="refresh" class="text-xs text-cyan-300 hover:text-white">Refresh</button></div><div id="list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main><script src="library.js"></script><script>
let items=[],active='Semua';const search=document.getElementById('search'),sort=document.getElementById('sort'),list=document.getElementById('list'),count=document.getElementById('count'),filters=document.getElementById('filters');
function renderFilters(){const cats=['Semua',...new Set(items.map(x=>x.category).filter(Boolean))];filters.innerHTML=cats.map(c=>'<button data-cat="'+Library.esc(c)+'" class="px-3 py-1.5 rounded-full border text-xs '+(c===active?'border-cyan-400/50 bg-cyan-950/50 text-cyan-200':'border-slate-700 text-slate-400 hover:text-white')+'">'+Library.esc(c)+'</button>').join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderFilters();render()})}
function render(){let q=search.value.toLowerCase().trim();let a=items.filter(x=>(active==='Semua'||x.category===active)&&(!q||[x.title,x.author,x.category,x.excerpt,x.description].some(v=>String(v||'').toLowerCase().includes(q))));a.sort((x,y)=>sort.value==='title'?x.title.localeCompare(y.title):sort.value==='oldest'?new Date(x.created_at)-new Date(y.created_at):new Date(y.created_at)-new Date(x.created_at));count.textContent=a.length+' koleksi';list.innerHTML=a.length?a.map(x=>Library.card(x,false)).join(''):'<div class="md:col-span-3 p-10 text-center rounded-2xl bg-techCard border border-dashed border-slate-700 text-sm text-slate-500">Belum ada koleksi yang cocok.</div>';lucide.createIcons()}
async function load(){try{items=await Library.list();renderFilters();render()}catch(e){list.innerHTML='<div class="md:col-span-3 p-8 rounded-2xl bg-red-950/20 border border-red-500/20 text-red-300 text-sm">'+Library.esc(e.message)+'</div>'}}search.oninput=render;sort.onchange=render;refresh.onclick=load;lucide.createIcons();load();
</script></body></html>
