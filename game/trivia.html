<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>.trivia | Bionest One</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#050b16}.card{box-shadow:0 20px 60px rgba(0,0,0,.3)}button{touch-action:manipulation}</style></head><body class="min-h-screen text-slate-100 bg-[radial-gradient(circle_at_top,rgba(168,85,247,.1),transparent_35%),#050b16]"><nav class="border-b border-purple-500/20 bg-[#050b16]/90"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"><a href="index.html" class="font-black tracking-widest text-purple-300">XI.B1</a><a href="index.html" class="text-xs text-slate-400">← Game Hub</a></div></nav><main class="max-w-4xl mx-auto px-4 py-10"><p class="text-xs tracking-[.3em] text-purple-300">GAME DIVISION</p><h1 class="text-4xl md:text-5xl font-black mt-2">🧠 .trivia</h1><section class="card rounded-3xl border border-purple-500/20 bg-slate-900/70 p-5 md:p-7 mt-7"><div id="commands" class="flex flex-wrap gap-2"></div><div id="game" class="mt-6 rounded-2xl bg-slate-950/50 border border-white/5 min-h-72 flex items-center justify-center"><div class="text-center py-10 text-slate-500">Pilih command.</div></div></section><aside class="rounded-3xl border border-purple-500/15 bg-slate-900/60 p-5 mt-5 flex flex-wrap items-center justify-between gap-5"><div><p class="text-[10px] text-slate-500">SALDO</p><b id="balance" class="text-2xl text-emerald-300">Rp0</b></div><div class="flex gap-6 text-sm"><span>🧠 <b id="count">0</b> selesai</span><span>🎯 <b id="correct">0</b> benar</span></div></aside></main><script>
const KEY='bionestFishing_'+((JSON.parse(sessionStorage.getItem('bionestProfile')||'null')?.username)||'guest');
let st=JSON.parse(localStorage.getItem(KEY)||'null')||{};st.balance??=0;st.triviaCount??=0;st.triviaCorrect??=0;
let active=null,timer=null;
const rewards={mudah:500,sedang:1000,sulit:2500};
const categories=['umum','sains','sejarah','geografi','teknologi','musik','olahraga'];
const levels={mudah:'mudah',sedang:'sedang',sulit:'sulit'};
const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(st));side()}
function side(){$('balance').textContent=money(st.balance);$('count').textContent=st.triviaCount;$('correct').textContent=st.triviaCorrect}
function commandButtons(){
  $('commands').innerHTML=categories.flatMap(cat=>Object.keys(levels).map(level=>'<button data-cat="'+cat+'" data-level="'+level+'" class="px-3 py-2 rounded-xl bg-purple-400/10 border border-purple-400/20 text-purple-300 text-xs font-bold hover:bg-purple-400/20">.trivia '+cat+' '+level+'</button>')).join('');
  document.querySelectorAll('#commands button').forEach(b=>b.onclick=()=>start(b.dataset.cat,b.dataset.level));
}
async function start(cat,level){
  if(active)return;
  $('game').innerHTML='<div class="text-center py-12"><div class="text-3xl animate-pulse">🧠</div><p class="text-sm text-slate-400 mt-3">Membuat soal...</p></div>';
  try{
    const res=await fetch('../api/trivia.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kategori:cat,level})});
    const data=await res.json();
    if(!res.ok||!data.ok)throw new Error(data.error||'Gagal membuat soal.');
    active={cat,level,answer:data.options.findIndex(x=>x.correct),answerText:data.options.find(x=>x.correct).text,reward:data.reward,left:60};
    const opts=data.options.map((o,i)=>'<button data-i="'+i+'" class="opt text-left p-4 rounded-xl bg-slate-950 border border-white/5 hover:border-purple-400/60 transition"><b class="text-purple-300 mr-2">'+String.fromCharCode(65+i)+'.</b>'+escapeHtml(o.text)+'</button>').join('');
    $('game').innerHTML='<div class="w-full"><div class="flex justify-between gap-3 text-xs text-purple-300"><span>.trivia '+escapeHtml(cat)+' '+escapeHtml(level)+'</span><span>+'+money(data.reward)+'</span></div><h2 class="text-2xl md:text-3xl font-black mt-5">'+escapeHtml(data.soal)+'</h2><p id="time" class="text-orange-300 font-bold mt-3">60 detik</p><div class="grid sm:grid-cols-2 gap-3 mt-6">'+opts+'</div><button id="giveup" class="mt-5 text-xs text-slate-500">🏳️ Nyerah</button></div>';
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(Number(b.dataset.i)===active.answer));
    $('giveup').onclick=()=>finish(false,true);
    timer=setInterval(()=>{if(!active)return;active.left--;if(active.left<=0)finish(false,false);else $('time').textContent=active.left+' detik'},1000);
  }catch(e){
    $('game').innerHTML='<div class="text-center py-12"><div class="text-4xl">⚠️</div><p class="text-red-300 mt-3">'+escapeHtml(e.message)+'</p><button onclick="commandButtons()" class="mt-5 text-xs text-purple-300">KEMBALI</button></div>';
  }
}
function finish(ok,giveup=false){
  if(!active)return;clearInterval(timer);timer=null;const a=active;active=null;st.triviaCount++;
  if(ok){st.triviaCorrect++;st.balance+=a.reward;save();$('game').innerHTML='<div class="text-center py-12"><div class="text-6xl">🎉</div><h2 class="text-3xl font-black text-emerald-300 mt-3">BENAR!</h2><p class="mt-2">+ '+money(a.reward)+'</p><button class="again mt-6 px-5 py-3 rounded-xl bg-purple-400/10 text-purple-300 font-bold">SOAL LAGI</button></div>'}
  else{$('game').innerHTML='<div class="text-center py-12"><div class="text-6xl">'+(giveup?'🏳️':'⏰')+'</div><h2 class="text-3xl font-black mt-3">'+(giveup?'MENYERAH':'WAKTU HABIS')+'</h2><p class="mt-2 text-slate-400">Jawaban: <b class="text-purple-300">'+escapeHtml(a.answerText)+'</b></p><button class="again mt-6 px-5 py-3 rounded-xl bg-purple-400/10 text-purple-300 font-bold">SOAL LAGI</button></div>';save()}
  document.querySelector('.again').onclick=()=>start(a.cat,a.level);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
commandButtons();side();
</script></body></html>
