<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trivia | Bionest One</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#050b16}.card{box-shadow:0 20px 60px rgba(0,0,0,.3)}</style></head><body class="min-h-screen text-slate-100 bg-[radial-gradient(circle_at_top,rgba(168,85,247,.1),transparent_35%),#050b16]"><nav class="border-b border-purple-500/20 bg-[#050b16]/90"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"><a href="index.html" class="font-black tracking-widest text-purple-300">XI.B1</a><a href="index.html" class="text-xs text-slate-400">← Game Hub</a></div></nav><main class="max-w-4xl mx-auto px-4 py-10"><p class="text-xs tracking-[.3em] text-purple-300">GAME DIVISION</p><h1 class="text-4xl md:text-5xl font-black mt-2">🧠 Trivia</h1><p class="text-slate-400 mt-2">Kuis pengetahuan umum. Logic-nya mengikuti bot WA: kategori, difficulty, pilihan A-D, 60 detik.</p><div class="grid md:grid-cols-[1fr_.35fr] gap-5 mt-7"><section class="card rounded-3xl border border-purple-500/20 bg-slate-900/70 p-6"><div class="flex flex-wrap gap-2" id="controls"></div><div id="game" class="mt-7"><div class="text-center py-10 text-slate-500">Pilih kategori dan tingkat kesulitan.</div></div></section><aside class="rounded-3xl border border-purple-500/15 bg-slate-900/60 p-5 h-fit"><p class="text-[10px] text-slate-500">SALDO</p><b id="balance" class="text-2xl text-emerald-300">Rp0</b><div class="mt-5 space-y-3 text-sm"><div class="flex justify-between"><span>🧠 Trivia selesai</span><b id="count">0</b></div><div class="flex justify-between"><span>🎯 Benar</span><b id="correct">0</b></div></div></aside></div></main><script>
const KEY='bionestFishing_'+((JSON.parse(sessionStorage.getItem('bionestProfile')||'null')?.username)||'guest');let st=JSON.parse(localStorage.getItem(KEY)||'null')||{balance:0};st.balance??=0;st.triviaCount??=0;st.triviaCorrect??=0;localStorage.setItem(KEY,JSON.stringify(st));let active=null,timer=null;
const Q=[['umum','Indonesia memiliki berapa provinsi?',['34','37','38','40'],'c'],['umum','Planet terbesar di Tata Surya adalah?',['Bumi','Jupiter','Saturnus','Mars'],'b'],['sains','Proses tumbuhan membuat makanan menggunakan cahaya disebut?',['Respirasi','Fotosintesis','Fermentasi','Transpirasi'],'b'],['sejarah','Proklamasi Kemerdekaan Indonesia dibacakan pada tahun?',['1942','1945','1949','1950'],'b'],['geografi','Gunung tertinggi di dunia adalah?',['Kilimanjaro','Everest','Elbrus','Fuji'],'b'],['teknologi','HTML digunakan terutama untuk?',['Struktur halaman web','Mengolah database','Mengedit video','Mengompilasi kernel'],'a'],['musik','Alat musik yang memiliki tuts hitam dan putih adalah?',['Biola','Gitar','Piano','Saksofon'],'c'],['olahraga','Jumlah pemain dalam satu tim sepak bola di lapangan adalah?',['9','10','11','12'],'c'],['umum','Lambang kimia untuk emas adalah?',['Ag','Au','Fe','Cu'],'b'],['sains','Satuan SI untuk arus listrik adalah?',['Volt','Ohm','Ampere','Watt'],'c']];
const rewards={mudah:500,sedang:1000,sulit:2500};const diffs={mudah:'MUDAH',sedang:'SEDANG',sulit:'SULIT'};function money(n){return'Rp'+n.toLocaleString('id-ID')}function save(){localStorage.setItem(KEY,JSON.stringify(st));side()}function side(){$('balance').textContent=money(st.balance);$('count').textContent=st.triviaCount;$('correct').textContent=st.triviaCorrect}function start(cat,level){if(active)return;let pool=Q.filter(q=>q[0]===cat);if(!pool.length)pool=Q;let x=pool[Math.floor(Math.random()*pool.length)],opts=x[2].map((t,i)=>({t,ok:String.fromCharCode(97,i)===x[3]})).sort(()=>Math.random()-.5),labels=['a','b','c','d'];let ans='';const html=opts.map((o,i)=>{if(o.ok)ans=labels[i];return'<button data-a="'+labels[i]+'" class="opt text-left p-4 rounded-xl bg-slate-950 border border-white/5 hover:border-purple-400/50 transition"><b class="text-purple-300 mr-2">'+labels[i].toUpperCase()+'.</b>'+o.t+'</button>'}).join('');active={cat,level,answer:ans,text:opts.find(o=>o.ok).t,reward:rewards[level],left:60};$('game').innerHTML='<span class="text-xs text-purple-300">'+cat.toUpperCase()+' • '+diffs[level]+' • +'+money(active.reward)+'</span><h2 class="text-2xl md:text-3xl font-black mt-5">'+x[1]+'</h2><p id="time" class="text-orange-300 font-bold mt-3">60 detik</p><div class="grid sm:grid-cols-2 gap-3 mt-6">'+html+'</div><button id="giveup" class="mt-5 text-xs text-slate-500">🏳️ Nyerah</button>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>end(b.dataset.a===active.answer));$('giveup').onclick=()=>end(false,true);timer=setInterval(()=>{active.left--;if(active.left<=0)end(false,false);else $('time').textContent=active.left+' detik'},1000)}function end(ok,giveup=false){clearInterval(timer);timer=null;const a=active;active=null;st.triviaCount++;if(ok){st.triviaCorrect++;st.balance+=a.reward;save();$('game').innerHTML='<div class="text-center py-10"><div class="text-6xl">🎉</div><h2 class="text-3xl font-black text-emerald-300 mt-3">BENAR!</h2><p class="mt-2">+ '+money(a.reward)+'</p><p class="text-xs text-slate-500 mt-2">Jawaban: '+a.answer.toUpperCase()+'. '+a.text+'</p></div>'}else{$('game').innerHTML='<div class="text-center py-10"><div class="text-6xl">'+(giveup?'🏳️':'⏰')+'</div><h2 class="text-3xl font-black mt-3">'+(giveup?'MENYERAH':'WAKTU HABIS')+'</h2><p class="mt-2">Jawaban: <b class="text-purple-300">'+a.answer.toUpperCase()+'. '+a.text+'</b></p></div>';save()}}const cats=['umum','sains','sejarah','geografi','teknologi','musik','olahraga'];$('controls').innerHTML=cats.map(c=>'<div class="flex gap-1 w-full mb-1"><span class="px-3 py-2 text-xs text-slate-400 uppercase">'+c+'</span>'+Object.keys(rewards).map(d=>'<button onclick="start(\''+c+'\',\''+d+'\')" class="px-3 py-2 rounded-lg bg-purple-400/10 border border-purple-400/20 text-purple-300 text-xs font-bold">'+diffs[d]+' +'+rewards[d]+'</button>').join('')+'</div>').join('');side();</script></body></html>
