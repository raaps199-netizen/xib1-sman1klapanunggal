<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math | Bionest One</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#050b16}.card{box-shadow:0 20px 60px rgba(0,0,0,.3)}</style></head><body class="min-h-screen text-slate-100 bg-[radial-gradient(circle_at_top,rgba(0,242,254,.1),transparent_35%),#050b16]"><nav class="border-b border-cyan-500/20 bg-[#050b16]/90"><div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"><a href="index.html" class="font-black tracking-widest text-cyan-300">XI.B1</a><a href="index.html" class="text-xs text-slate-400">← Game Hub</a></div></nav><main class="max-w-4xl mx-auto px-4 py-10"><p class="text-xs tracking-[.3em] text-cyan-300">GAME DIVISION</p><h1 class="text-4xl md:text-5xl font-black mt-2">🧮 Math</h1><p class="text-slate-400 mt-2">Jawab soal matematika, dapatkan saldo. Dompet kosong bukan alasan untuk menyerah pada angka.</p><div class="grid md:grid-cols-[1fr_.35fr] gap-5 mt-7"><section class="card rounded-3xl border border-cyan-500/20 bg-slate-900/70 p-6"><div class="flex flex-wrap gap-2" id="levels"></div><div id="game" class="mt-7"><div class="text-center py-10"><p class="text-slate-500">Pilih tingkat kesulitan untuk mulai.</p></div></div></section><aside class="rounded-3xl border border-cyan-500/15 bg-slate-900/60 p-5 h-fit"><p class="text-[10px] text-slate-500">SALDO</p><b id="balance" class="text-2xl text-emerald-300">Rp0</b><div class="mt-5 space-y-3 text-sm"><div class="flex justify-between"><span>🧮 Math selesai</span><b id="count">0</b></div><div class="flex justify-between"><span>🎯 Benar</span><b id="correct">0</b></div></div></aside></div></main><script>
const KEY='bionestFishing_'+((JSON.parse(sessionStorage.getItem('bionestProfile')||'null')?.username)||'guest');let st=JSON.parse(localStorage.getItem(KEY)||'null')||{balance:0};st.balance??=0;st.mathCount??=0;st.mathCorrect??=0;localStorage.setItem(KEY,JSON.stringify(st));let active=null,timer=null;
const levels={mudah:{label:'MUDAH',reward:250,gen(){let a=r(1,20),b=r(1,20),o=Math.random()<.5?'+':'-';return{q:a+' '+o+' '+b,a:o==='+'?a+b:a-b}}},sedang:{label:'SEDANG',reward:500,gen(){let o=['+','-','*'][r(0,2)],a=o==='*'?r(5,15):r(10,50),b=o==='*'?r(5,15):r(10,50);return{q:a+' '+o+' '+b,a:o==='+'?a+b:o==='-'?a-b:a*b}}},sulit:{label:'SULIT',reward:1000,gen(){let a=r(20,100),b=r(10,50),c=r(5,20),o=['+','-','*'][r(0,2)];return{q:a+' '+o+' '+b+' + '+c,a:o==='+'?a+b+c:o==='-'?a-b+c:a*b+c}}},extreme:{label:'EXTREME',reward:2500,gen(){let a=r(50,200),b=r(10,30),c=r(2,10);return{q:a+' + '+b+' × '+c,a:a+b*c}}},max:{label:'MAX',reward:5000,gen(){let a=r(100,500),b=r(20,50),c=r(10,30);return{q:'('+a+' + '+b+') × '+c,a:(a+b)*c}}}};function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function money(n){return'Rp'+Math.floor(n).toLocaleString('id-ID')}function save(){localStorage.setItem(KEY,JSON.stringify(st));renderSide()}function renderSide(){$('balance').textContent=money(st.balance);$('count').textContent=st.mathCount;$('correct').textContent=st.mathCorrect}function start(level){if(active)return;const d=levels[level],x=d.gen();active={level,answer:String(x.a),reward:d.reward,left:60};$('game').innerHTML='<div class="text-center"><span class="text-xs text-cyan-300">'+d.label+' • +'+money(d.reward)+'</span><h2 class="text-5xl md:text-7xl font-black mt-7">'+x.q+' = ?</h2><p id="time" class="text-orange-300 font-bold mt-6">60 detik</p><input id="ans" type="number" inputmode="numeric" autofocus class="w-full mt-5 px-4 py-4 rounded-xl bg-slate-950 border border-cyan-400/20 text-center text-2xl outline-none" placeholder="Ketik jawaban"><button id="submit" class="w-full mt-3 py-3 rounded-xl bg-gradient-to-r from-cyan-300 to-blue-400 text-slate-950 font-black">JAWAB</button><button id="giveup" class="mt-3 text-xs text-slate-500">Nyerah</button></div>';$('submit').onclick=answer;$('giveup').onclick=()=>end(false,true);$('ans').onkeydown=e=>{if(e.key==='Enter')answer()};timer=setInterval(()=>{active.left--;if(active.left<=0)end(false,false);else $('time').textContent=active.left+' detik'},1000)}function answer(){if(!active)return;const ok=$('ans').value.trim()===active.answer;end(ok,false)}function end(ok,giveup){clearInterval(timer);timer=null;const a=active;active=null;st.mathCount++;if(ok){st.mathCorrect++;st.balance+=a.reward;save();$('game').innerHTML='<div class="text-center py-10"><div class="text-6xl">🎉</div><h2 class="text-3xl font-black mt-3 text-emerald-300">BENAR!</h2><p class="mt-2">+ '+money(a.reward)+'</p><button onclick="start(\''+a.level+'\')" class="mt-6 px-5 py-3 rounded-xl bg-cyan-400/10 text-cyan-300 font-bold">SOAL LAGI</button></div>'}else{$('game').innerHTML='<div class="text-center py-10"><div class="text-6xl">'+(giveup?'🏳️':'⏰')+'</div><h2 class="text-3xl font-black mt-3">'+(giveup?'MENYERAH':'WAKTU HABIS')+'</h2><p class="mt-2 text-slate-400">Jawaban yang benar: <b class="text-cyan-300">'+a.answer+'</b></p><button onclick="start(\''+a.level+'\')" class="mt-6 px-5 py-3 rounded-xl bg-cyan-400/10 text-cyan-300 font-bold">COBA LAGI</button></div>';save()}}$('levels').innerHTML=Object.entries(levels).map(([k,v])=>'<button onclick="start(\''+k+'\')" class="px-4 py-2 rounded-xl bg-cyan-400/10 border border-cyan-400/20 text-cyan-300 text-xs font-bold">'+v.label+' • '+money(v.reward)+'</button>').join('');renderSide();</script></body></html>
