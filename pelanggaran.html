<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Pelanggaran | Bionest One</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config={theme:{extend:{colors:{techCyan:'#00f2fe',techBlue:'#4facfe',techDark:'#0b1120',techCard:'#1e293b'}}}};
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-techDark text-slate-100 font-sans antialiased bg-grid min-h-screen">
<nav class="fixed top-0 w-full z-50 bg-techDark/85 backdrop-blur-md border-b border-cyan-500/20">
<div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
<a href="index.html" class="flex items-center gap-2 font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-techCyan to-techBlue"><i data-lucide="arrow-left" class="text-techCyan w-5 h-5"></i>BIONEST ONE</a>
<span class="text-xs text-slate-500 font-mono">XI.B1</span>
</div>
</nav>
<main class="pt-28 pb-16 max-w-6xl mx-auto px-4">
<div class="mb-8">
<p class="text-xs text-techCyan uppercase tracking-[0.3em] font-mono">CLASS RECORD</p>
<h1 class="text-3xl md:text-4xl font-black mt-2">Riwayat Pelanggaran</h1>
<p class="text-sm text-slate-400 mt-2">Daftar laporan pelanggaran XI.B1 yang tercatat oleh guru.</p>
</div>

<div class="grid md:grid-cols-4 gap-3 mb-6">
<div class="md:col-span-2 relative">
<i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
<input id="search" placeholder="Cari nama atau pelanggaran..." class="w-full pl-11 pr-4 py-3 rounded-xl bg-techCard border border-slate-700 text-white outline-none focus:border-techCyan/60">
</div>
<select id="category" class="px-4 py-3 rounded-xl bg-techCard border border-slate-700 text-white outline-none"><option value="">Semua kategori</option></select>
<select id="subject" class="px-4 py-3 rounded-xl bg-techCard border border-slate-700 text-white outline-none"><option value="">Semua mapel</option></select>
</div>

<div class="flex items-center justify-between mb-4">
<p id="count" class="text-xs text-slate-500">Memuat...</p>
<button id="refresh" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-cyan-500/20 text-cyan-300 text-xs hover:bg-cyan-500/10 transition"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh</button>
</div>
<div id="list" class="space-y-3"></div>
</main>
<script>
let records=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function populateFilters(){
 const cats=[...new Set(records.map(x=>x.category).filter(Boolean))].sort();
 const subs=[...new Set(records.map(x=>x.subject).filter(Boolean))].sort();
 category.innerHTML='<option value="">Semua kategori</option>'+cats.map(x=>'<option>'+esc(x)+'</option>').join('');
 subject.innerHTML='<option value="">Semua mapel</option>'+subs.map(x=>'<option>'+esc(x)+'</option>').join('');
}
function render(){
 const q=search.value.trim().toLowerCase(), cat=category.value, sub=subject.value;
 const filtered=records.filter(x=>(!q||[x.student_name,x.violation,x.category,x.subject].some(v=>String(v||'').toLowerCase().includes(q)))&&(!cat||x.category===cat)&&(!sub||x.subject===sub));
 count.textContent=filtered.length+' laporan ditampilkan dari '+records.length+' laporan';
 if(!filtered.length){list.innerHTML='<div class="p-10 rounded-2xl bg-techCard border border-dashed border-cyan-500/20 text-center"><i data-lucide="shield-check" class="w-9 h-9 mx-auto text-slate-600 mb-3"></i><p class="text-sm text-slate-400">Belum ada laporan yang cocok.</p></div>';lucide.createIcons();return;}
 list.innerHTML=filtered.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).map(x=>'<article class="p-5 rounded-2xl bg-techCard border border-slate-800 hover:border-cyan-500/20 transition"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><p class="font-bold text-white">'+esc(x.student_name)+'</p><p class="text-xs text-techCyan mt-1">'+esc(x.violation)+'</p></div><span class="w-fit px-2.5 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-500/20 text-[10px]">'+esc(x.category)+'</span></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4 text-xs"><div><p class="text-slate-600 uppercase">Mapel</p><p class="text-slate-300 mt-1">'+esc(x.subject)+'</p></div><div><p class="text-slate-600 uppercase">Guru</p><p class="text-slate-300 mt-1">'+esc(x.reported_by_name)+'</p></div><div><p class="text-slate-600 uppercase">Tanggal</p><p class="text-slate-300 mt-1">'+esc(x.date)+'</p></div><div><p class="text-slate-600 uppercase">Jam</p><p class="text-slate-300 mt-1">'+esc(x.time)+' WIB</p></div></div></article>').join('');
 lucide.createIcons();
}
async function load(){
 list.innerHTML='<div class="p-8 text-center text-sm text-slate-500">Memuat riwayat...</div>';
 try{const r=await fetch('/api/violation?v='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal memuat');records=Array.isArray(d.violations)?d.violations:[];populateFilters();render();}catch(e){list.innerHTML='<div class="p-8 rounded-2xl bg-red-950/20 border border-red-500/20 text-center text-sm text-red-300">'+esc(e.message)+'</div>';count.textContent='Gagal memuat';}
}
[search,category,subject].forEach(x=>x.addEventListener('input',render));
refresh.onclick=load; lucide.createIcons(); load();
</script>
</body>
</html>
