<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Guru · Bionest One</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body class="min-h-screen bg-[#0b1120] text-white flex items-center justify-center p-6">
<main class="w-full max-w-md text-center">
<p class="text-xs uppercase tracking-[.3em] text-cyan-400">Bionest One · XI.B1</p>
<h1 class="text-3xl font-black mt-3">QR Laporan Guru</h1>
<p class="text-sm text-slate-400 mt-2">QR ini hanya membuka halaman verifikasi. PIN guru tetap diperlukan untuk membuat laporan.</p>
<div class="mt-7 bg-white rounded-3xl p-6 inline-block"><div id="qr"></div></div>
<p class="text-xs text-slate-500 mt-4 break-all" id="url"></p>
<button onclick="window.print()" class="mt-5 px-5 py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-400 text-slate-950 font-bold">Cetak QR</button>
</main>
<script>
const url=new URL('laporan.html',location.href).href;
document.getElementById('url').textContent=url;
new QRCode(document.getElementById('qr'),{text:url,width:240,height:240,colorDark:'#0b1120',colorLight:'#ffffff'});
</script></body></html>
