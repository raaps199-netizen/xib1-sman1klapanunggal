<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | XI.B1 SMAN 1 Klapanunggal</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-techDark text-slate-100 font-sans antialiased bg-grid relative overflow-hidden">
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-cyan-500/10 blur-3xl"></div>
        <div class="absolute -bottom-40 -right-32 w-[30rem] h-[30rem] rounded-full bg-blue-500/10 blur-3xl"></div>
    </div>

    <main class="relative z-10 min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md">
            <a href="index.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-techCyan transition mb-5">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Kembali
            </a>

            <section class="rounded-3xl bg-techCard/90 backdrop-blur-xl border border-cyan-500/25 p-7 sm:p-8 shadow-2xl shadow-cyan-950/40">
                <div class="flex items-center gap-3 mb-7">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-techCyan to-techBlue flex items-center justify-center text-techDark shadow-lg shadow-cyan-500/20">
                        <i data-lucide="cpu" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="font-extrabold tracking-wider">XI.B1</p>
                        <p class="text-[10px] text-slate-500 uppercase tracking-[0.2em]">Bionest One</p>
                    </div>
                </div>

                <p class="text-xs text-techCyan uppercase tracking-[0.3em] font-mono">Member Access</p>
                <h1 class="text-3xl sm:text-4xl font-extrabold mt-2">Selamat datang kembali.</h1>
                <p class="text-sm text-slate-400 mt-2 mb-7">Masuk untuk membuka ruang pribadi kelas XI.B1.</p>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="username" class="block text-xs font-medium text-slate-400 mb-2">Username</label>
                        <div class="relative">
                            <i data-lucide="user-round" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                            <input id="username" required autocomplete="username"
                                class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-950/60 border border-slate-700 text-white outline-none focus:border-techCyan/60 focus:ring-1 focus:ring-techCyan/20 transition"
                                placeholder="Masukkan username">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-medium text-slate-400 mb-2">Password</label>
                        <div class="relative">
                            <i data-lucide="key-round" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                            <input id="password" type="password" required autocomplete="current-password"
                                class="w-full pl-11 pr-12 py-3.5 rounded-xl bg-slate-950/60 border border-slate-700 text-white outline-none focus:border-techCyan/60 focus:ring-1 focus:ring-techCyan/20 transition"
                                placeholder="Masukkan password">
                            <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-500 hover:text-techCyan transition" aria-label="Tampilkan password">
                                <i data-lucide="eye" id="passwordIcon" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <button id="loginBtn" type="submit"
                        class="w-full mt-2 px-5 py-3.5 rounded-xl bg-gradient-to-r from-techCyan to-techBlue text-techDark font-extrabold shadow-lg shadow-cyan-500/10 hover:shadow-cyan-500/20 hover:-translate-y-0.5 transition">
                        Masuk
                    </button>

                    <p id="loginStatus" class="text-xs text-center min-h-5 pt-1"></p>
                </form>
            </section>

            <p class="text-center text-[11px] text-slate-600 mt-5">XI.B1 SMAN 1 Klapanunggal · Bionest One</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const passwordIcon = document.getElementById('passwordIcon');

        togglePassword.addEventListener('click', () => {
            const visible = passwordInput.type === 'text';
            passwordInput.type = visible ? 'password' : 'text';
            passwordIcon.setAttribute('data-lucide', visible ? 'eye' : 'eye-off');
            togglePassword.setAttribute('aria-label', visible ? 'Tampilkan password' : 'Sembunyikan password');
            lucide.createIcons();
        });

        lucide.createIcons();
    </script>
</body>
</html>
