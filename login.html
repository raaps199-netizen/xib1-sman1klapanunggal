<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Access | XI.B1</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="style.css">
<style>
.login-shell{background:radial-gradient(circle at 20% 10%,rgba(34,211,238,.12),transparent 30%),radial-gradient(circle at 90% 90%,rgba(59,130,246,.14),transparent 32%);}
.login-card{box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 45px rgba(34,211,238,.06);}
.input-glow:focus{box-shadow:0 0 0 3px rgba(34,211,238,.08),0 0 24px rgba(34,211,238,.06);}
</style>
</head>
<body class="min-h-screen bg-techDark text-slate-100 font-sans antialiased bg-grid">
<main class="login-shell min-h-screen flex items-center justify-center px-5 py-10">
<div class="w-full max-w-[430px]">
<a href="index.html" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-cyan-300 transition mb-6">
<i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke halaman utama
</a>

<section class="login-card rounded-[28px] border border-white/10 bg-slate-950/80 backdrop-blur-2xl overflow-hidden">
<div class="h-1 bg-gradient-to-r from-cyan-400 via-blue-500 to-cyan-400"></div>

<div class="p-7 sm:p-9">
<div class="flex items-center justify-between mb-9">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-2xl bg-cyan-400/10 border border-cyan-300/20 flex items-center justify-center">
<i data-lucide="layers-3" class="w-5 h-5 text-cyan-300"></i>
</div>
<div>
<p class="font-black tracking-[.12em]">BIONEST ONE</p>
<p class="text-[10px] text-slate-500 uppercase tracking-[.25em]">XI.B1 · Member Area</p>
</div>
</div>
<span class="flex items-center gap-1.5 text-[10px] uppercase tracking-widest text-emerald-400">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Secure
</span>
</div>

<div class="mb-7">
<p class="text-[11px] font-mono uppercase tracking-[.28em] text-cyan-300/80">Private access</p>
<h1 class="text-3xl sm:text-4xl font-black tracking-tight mt-2">Masuk ke ruangmu.</h1>
<p class="text-sm leading-6 text-slate-500 mt-3">Akses profil dan ruang pribadi anggota XI.B1.</p>
</div>

<form id="loginForm" class="space-y-5">
<div>
<label for="username" class="block text-xs font-semibold text-slate-400 mb-2">Username</label>
<div class="relative">
<i data-lucide="user-round" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-600"></i>
<input id="username" required autocomplete="username" spellcheck="false"
class="input-glow w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white/[.03] border border-white/10 text-white placeholder:text-slate-700 outline-none focus:border-cyan-300/40 transition"
placeholder="contoh: daffa">
</div>
</div>

<div>
<label for="password" class="block text-xs font-semibold text-slate-400 mb-2">Password</label>
<div class="relative">
<i data-lucide="lock-keyhole" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-600"></i>
<input id="password" type="password" required autocomplete="current-password"
class="input-glow w-full pl-11 pr-12 py-3.5 rounded-2xl bg-white/[.03] border border-white/10 text-white placeholder:text-slate-700 outline-none focus:border-cyan-300/40 transition"
placeholder="Masukkan password">
<button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-600 hover:text-cyan-300 transition" aria-label="Tampilkan password">
<i data-lucide="eye" id="passwordIcon" class="w-4 h-4"></i>
</button>
</div>
</div>

<button id="loginBtn" type="submit" class="w-full py-3.5 rounded-2xl bg-white text-slate-950 font-black hover:bg-cyan-100 active:scale-[.99] transition">
Masuk
</button>
<p id="loginStatus" class="text-xs text-center min-h-5 pt-1"></p>
</form>

<div class="mt-7 pt-5 border-t border-white/5 flex items-center gap-2 text-[11px] text-slate-600">
<i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
<span>Session terenkripsi melalui Supabase Auth</span>
</div>
</div>
</section>

<p class="text-center text-[10px] text-slate-700 mt-5 tracking-wide">XI.B1 SMAN 1 Klapanunggal · Bionest One</p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
const passwordInput=document.getElementById('password');
const togglePassword=document.getElementById('togglePassword');
const passwordIcon=document.getElementById('passwordIcon');
togglePassword.addEventListener('click',()=>{
 const visible=passwordInput.type==='text';
 passwordInput.type=visible?'password':'text';
 passwordIcon.setAttribute('data-lucide',visible?'eye':'eye-off');
 togglePassword.setAttribute('aria-label',visible?'Tampilkan password':'Sembunyikan password');
 lucide.createIcons();
});
lucide.createIcons();
</script>
</body>
</html>
