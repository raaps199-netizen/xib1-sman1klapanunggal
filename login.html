<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Access | XI.B1</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = {
    theme: { extend: { colors: {
        techCyan: '#00f2fe',
        techBlue: '#4facfe',
        techDark: '#0b1120',
        techCard: '#1e293b'
    }}}
};
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-techDark text-slate-100 font-sans antialiased bg-grid relative overflow-x-hidden">
<nav class="fixed top-0 w-full z-50 bg-techDark/80 backdrop-blur-md border-b border-cyan-500/20">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
<div class="flex items-center gap-2">
<i data-lucide="cpu" class="text-techCyan w-8 h-8 animate-pulse"></i>
<a href="index.html" class="font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-techCyan to-techBlue">XI.B1</a>
</div>
<a href="index.html" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-cyan-500/30 text-sm text-slate-300 hover:text-techCyan hover:bg-cyan-500/10 transition">
<i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali
</a>
</div>
</nav>

<main class="min-h-screen pt-24 pb-12 flex items-center justify-center px-4 relative">
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_20%_20%,rgba(0,242,254,.10),transparent_30%),radial-gradient(circle_at_80%_80%,rgba(79,172,254,.10),transparent_30%)]"></div>
<div class="w-full max-w-md relative z-10">
<div class="text-center mb-7">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-techCyan/30 bg-cyan-950/40 text-techCyan text-xs tracking-widest uppercase mb-5">
<i data-lucide="users-round" class="w-3.5 h-3.5"></i> XI.B1 Member Area
</div>
<h1 class="text-4xl font-extrabold tracking-tight">Masuk ke ruangmu.</h1>
<p class="text-sm text-cyan-200/60 mt-3">Akses profil dan ruang pribadi anggota XI.B1.</p>
</div>

<section class="p-6 sm:p-8 rounded-3xl bg-techCard/90 border border-cyan-500/25 backdrop-blur-xl shadow-2xl shadow-cyan-950/30">
<div class="flex items-center gap-3 mb-7 pb-5 border-b border-slate-700/60">
<div class="w-11 h-11 rounded-2xl bg-cyan-950/70 border border-techCyan/30 flex items-center justify-center">
<i data-lucide="shield-check" class="w-5 h-5 text-techCyan"></i>
</div>
<div>
<p class="font-bold">Private Access</p>
<p class="text-xs text-slate-500">Khusus anggota XI.B1</p>
</div>
<span class="ml-auto flex items-center gap-1.5 text-[10px] uppercase tracking-widest text-emerald-400">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online
</span>
</div>

<form id="loginForm" class="space-y-5">
<div>
<label for="username" class="block text-xs font-semibold text-slate-400 mb-2">Username</label>
<div class="relative">
<i data-lucide="user-round" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-600"></i>
<input id="username" required autocomplete="username" spellcheck="false" class="w-full pl-11 pr-4 py-3.5 rounded-xl bg-slate-950/60 border border-slate-700 text-white placeholder:text-slate-700 outline-none focus:border-techCyan/60 focus:ring-2 focus:ring-cyan-500/10 transition" placeholder="contoh: daffa">
</div>
</div>
<div>
<label for="password" class="block text-xs font-semibold text-slate-400 mb-2">Password</label>
<div class="relative">
<i data-lucide="lock-keyhole" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-600"></i>
<input id="password" type="password" required autocomplete="current-password" class="w-full pl-11 pr-12 py-3.5 rounded-xl bg-slate-950/60 border border-slate-700 text-white placeholder:text-slate-700 outline-none focus:border-techCyan/60 focus:ring-2 focus:ring-cyan-500/10 transition" placeholder="Masukkan password">
<button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-600 hover:text-techCyan transition" aria-label="Tampilkan password"><i data-lucide="eye" id="passwordIcon" class="w-4 h-4"></i></button>
</div>
</div>
<button id="loginBtn" type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-techCyan to-techBlue text-techDark font-bold tech-glow tech-glow-hover hover:opacity-90 active:scale-[.99] transition">Masuk ke Member Area</button>
<p id="loginStatus" class="text-xs text-center min-h-5 pt-1"></p>
</form>

<div class="mt-6 pt-5 border-t border-slate-700/60 flex items-center justify-between text-[11px] text-slate-500">
<span class="flex items-center gap-2"><i data-lucide="lock" class="w-3.5 h-3.5"></i> Private Area</span>
<span>XI.B1 · Bionest One</span>
</div>
</section>
<p class="text-center text-[10px] text-slate-600 mt-5">SMAN 1 Klapanunggal · Brilliant of Engineering One</p>
</div>
</main>
<script src="auth.js"></script>
<script>
const passwordInput=document.getElementById('password');
const togglePassword=document.getElementById('togglePassword');
const passwordIcon=document.getElementById('passwordIcon');
togglePassword.addEventListener('click',()=>{const visible=passwordInput.type==='text';passwordInput.type=visible?'password':'text';passwordIcon.setAttribute('data-lucide',visible?'eye':'eye-off');togglePassword.setAttribute('aria-label',visible?'Tampilkan password':'Sembunyikan password');lucide.createIcons();});
lucide.createIcons();
</script>
</body>
</html>
